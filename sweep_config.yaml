program: train_sweep.py
method: grid
metric:
  name: avg_epoch_l1_loss
  goal: minimize

parameters:
  model_type:
    values: ['swin_unetr', 'unetr', 'basic_unet']
  
  # All other hyperparameters use CLI defaults or can be overridden via command line
  # e.g., --lr 1e-4, --batch_size 8, --epochs 50, etc.
